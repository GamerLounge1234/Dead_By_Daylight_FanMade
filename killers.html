<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBD Killer Randomizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <style>
       
        :root {
            --dried-blood: #5a0000;
            --arterial-spray: #ff0000;
            --bone-white: #f5f5dc;
            --muted-bone: #c8c8b4;
            --font-ui: 'Cinzel', serif;
            --smooth-curve: cubic-bezier(0.4, 0, 0.2, 1);
            --bg-dark: #050000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at center, #1a0000 0%, #000000 80%);
            color: var(--bone-white);
            font-family: var(--font-ui);
            overflow: hidden; /* Hide scrollbars for the 3D void */
            height: 100vh;
            width: 100vw;
        }

        /* ==========================================================================
           USER'S PROVIDED NAVBAR
           ========================================================================== */
        @keyframes organicHeartbeatBorder {
            0% { border-bottom-color: var(--dried-blood); box-shadow: 0 4px 20px rgba(90,0,0,0.6); }
            15% { border-bottom-color: var(--arterial-spray); box-shadow: 0 4px 30px rgba(255,0,0,0.8); }
            30% { border-bottom-color: var(--dried-blood); box-shadow: 0 4px 20px rgba(90,0,0,0.6); }
            100% { border-bottom-color: var(--dried-blood); box-shadow: 0 4px 20px rgba(90,0,0,0.6); }
        }

        .navbar {
            width: 100%;
            height: 70px;
            position: fixed;
            top: 0;
            left: 0;
            background: linear-gradient(
                to bottom, 
                rgba(0, 0, 0, 0.98) 0%, 
                rgba(15, 0, 0, 0.90) 100%
            );
            border-bottom: 2px solid var(--dried-blood);
            z-index: 2000; /* Higher than killer images */
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            animation: organicHeartbeatBorder 4s infinite var(--smooth-curve);
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }

        .navbar li a {
            font-family: var(--font-ui);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--muted-bone);
            text-decoration: none;
            text-transform: uppercase;
            position: relative;
            padding: 5px 15px;
            transition: all 0.3s var(--smooth-curve);
        }

        .navbar li a::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--arterial-spray);
            transform: translate(-50%, -50%) rotate(-3deg);
            transition: width 0.4s var(--smooth-curve);
            box-shadow: 0 0 10px var(--arterial-spray);
            z-index: 2;
            opacity: 0;
        }

        .navbar li a:hover {
            color: var(--bone-white);
            text-shadow: 0 0 15px rgba(255, 5, 5, 0.7);
        }

        .navbar li a:hover::before {
            width: 100%;
            opacity: 1;
        }

        /* ==========================================================================
           3D SPACE & KILLERS
           ========================================================================== */
        #void-container {
            position: absolute;
            top: 70px; /* Below navbar */
            left: 0;
            width: 100%;
            height: calc(100vh - 70px);
            perspective: 1200px; /* Gives the 3D depth */
            overflow: hidden;
        }

        /* Wrapper controls the position and z-depth */
        .killer-wrapper {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            transition: transform 0.6s var(--smooth-curve), opacity 1s ease, filter 0.6s ease;
            will-change: transform;
        }

        /* The actual image handles the subtle floating animation */
        .killer-img {
            width: 200px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            animation: float 6s ease-in-out infinite alternate;
            transition: all 0.5s ease;
            user-select: none;
            -webkit-user-drag: none;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(-2deg); }
            100% { transform: translateY(-20px) rotate(2deg); }
        }

        /* --- SHUFFLING STATE --- */
        .is-shuffling .killer-wrapper {
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), filter 0.4s;
            filter: blur(3px) brightness(1.2);
        }
        
        .is-shuffling .killer-img {
            animation: none; /* stop float during high speed mixing */
            box-shadow: 0 0 40px var(--arterial-spray);
        }

        /* --- RESULT STATES --- */
        .loser {
            opacity: 0.15;
            filter: blur(5px) grayscale(50%);
            z-index: 1 !important;
        }

        .winner {
            z-index: 1000 !important;
            /* Center the wrapper completely */
            transform: translate3d(-50%, -50%, 400px) !important;
            transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 1s !important;
        }

        .winner .killer-img {
            width: 380px;
            box-shadow: 0 0 80px 20px rgba(255, 0, 0, 0.6), 0 0 150px rgba(255, 0, 0, 0.4);
            border: 2px solid var(--arterial-spray);
            animation: float-winner 4s ease-in-out infinite alternate;
        }

        @keyframes float-winner {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-15px) scale(1.02); }
        }

        /* ==========================================================================
           CONTROLS
           ========================================================================== */
        #controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3000;
        }

        #randomize-btn {
            background: linear-gradient(135deg, #2a0000 0%, #0a0000 100%);
            border: 2px solid var(--dried-blood);
            color: var(--bone-white);
            font-family: var(--font-ui);
            font-size: 1.8rem;
            font-weight: 700;
            padding: 15px 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        #randomize-btn::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,0,0,0.4), transparent);
            transform: skewX(-20deg);
            transition: 0s;
        }

        #randomize-btn:hover {
            border-color: var(--arterial-spray);
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.7);
            color: #fff;
            text-shadow: 0 0 10px red;
        }

        #randomize-btn:hover::after {
            left: 200%;
            transition: 0.8s ease-in-out;
        }

        #randomize-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            border-color: #333;
        }
    </style>
</head>
<body>

    <!-- User Navigation -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="index.html">Lobby</a></li>
            <li><a href="perks.html">Perks</a></li>
            <li><a href="Randomizer.html">Randomizer</a></li>
            <li><a href="Challenges.html">Challenges</a></li>
            <li><a href="killers.html">Killer Wheel</a></li>
            <li><a href="maps.html" class="active">Maps</a></li>
            <li><a href="CreatorsLounge.html">Creators</a></li>
        </ul>
    </nav>

    <!-- 3D Void for Killers -->
    <div id="void-container"></div>

    <!-- Interface -->
    <div id="controls">
        <button id="randomize-btn">Summon Entity</button>
    </div>

   <script>
        const killerNames = [
            "Artist.png", "Dredge.png", "Legion.png", "Skull.png",
            "Billy.png", "Executioner.png", "Lich.png", "Spirit.png",
            "Blight.png", "Freddy.png", "Nemesis.png", "SpringTrap.png",
            "Bubba.png", "GhostFace.png", "Nurse.png", "Trapper.png",
            "Chucky.png", "Ghoul.png", "oni.png", "Pig.png",
            "Clown.png", "Hag.png", "Pinhead.png", "Trickster.png",
            "Deathslinger.png", "HoundMaster.png", "Plague.png", "Twins.png",
            "Demo.png", "Huntress.png", "Sadako.png", "Unknown.png",
            "Doctor.png", "Karsue.png", "Singularity.png", "Vecna.png",
            "Dracula.png", "Knight.png", "Waraith.png", "Xeno.png"
        ];

        const voidContainer = document.getElementById('void-container');
        const randomizeBtn = document.getElementById('randomize-btn');
        const wrappers = [];

        // NEW: Array to keep track of killers that haven't been picked yet
        let availableKillers = [];

        // Helper to generate random 3D position
        function getRandomTransform() {
            // Screen width/height bounds
            const x = (Math.random() - 0.5) * 120; // -60vw to +60vw
            const y = (Math.random() - 0.5) * 100; // -50vh to +50vh
            const z = (Math.random() * -1000) + 200; // Depth: far back to slightly forward
            return `translate3d(${x}vw, ${y}vh, ${z}px)`;
        }

        // Initialize images in the void
        function initSpace() {
            killerNames.forEach((file, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'killer-wrapper';
                
                // Randomize animation delay so they don't all float in sync
                const delay = Math.random() * 5;
                
                const img = document.createElement('img');
                img.src = `killers/${file}`;
                img.className = 'killer-img';
                img.style.animationDelay = `-${delay}s`;

                wrapper.appendChild(img);
                wrapper.style.transform = getRandomTransform();
                
                voidContainer.appendChild(wrapper);
                wrappers.push(wrapper);
                
                // NEW: Populate the available pool with every killer's index on load
                availableKillers.push(index);
            });
        }

        let shuffleInterval;

        // Start Randomization
        randomizeBtn.addEventListener('click', () => {
            // NEW: If all killers have been picked, reset the pool
            if (availableKillers.length === 0) {
                console.log("All killers played! Resetting the Entity's pool...");
                // Refill the array with numbers 0 through 39
                availableKillers = wrappers.map((_, i) => i); 
            }

            randomizeBtn.disabled = true;
            randomizeBtn.innerText = "The Entity is choosing...";
            
            // Add shuffling visual effects
            voidContainer.classList.add('is-shuffling');

            // Reset classes if clicking again
            wrappers.forEach(w => {
                w.classList.remove('winner', 'loser');
            });

            // 1. High Speed Shuffling (Images warping around the screen)
            shuffleInterval = setInterval(() => {
                wrappers.forEach(w => {
                    w.style.transform = getRandomTransform();
                });
            }, 400); // Changes position every 400ms for a chaotic feel

            // 2. Stop Shuffling after 7 Seconds and pick a winner
            setTimeout(() => {
                clearInterval(shuffleInterval);
                voidContainer.classList.remove('is-shuffling');

                // NEW: Pick a random index FROM THE AVAILABLE POOL, not the full list
                const poolIndex = Math.floor(Math.random() * availableKillers.length);
                const winningIndex = availableKillers[poolIndex];

                // NEW: Remove the chosen killer from the available pool so they can't be picked again
                availableKillers.splice(poolIndex, 1);

                wrappers.forEach((wrapper, i) => {
                    if (i === winningIndex) {
                        // Bring winner to the very front center
                        wrapper.classList.add('winner');
                    } else {
                        // Push losers into the background
                        wrapper.classList.add('loser');
                        // Assign them a new slow, distant resting place
                        wrapper.style.transform = getRandomTransform();
                    }
                });

                // Re-enable button
                setTimeout(() => {
                    randomizeBtn.disabled = false;
                    // NEW: Shows how many killers are left before the pool resets
                    if (availableKillers.length > 0) {
                        randomizeBtn.innerText = `Resummon (${availableKillers.length} Left)`;
                    } else {
                        randomizeBtn.innerText = "Pool Empty - Click to Reset";
                    }
                }, 1500);

            }, 7000); // 7 seconds
        });

        // Setup on load
        window.addEventListener('DOMContentLoaded', initSpace);

    </script>
</body>
</html>
