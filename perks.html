<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DBD | Quantum Terminal</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,700;1,400&family=Teko:wght@500;700&family=Nosifer&display=swap');

:root {
    /* The Carnage Palette - Enhanced for Maximum Depth & Legibility */
    --pitch-black: #000000;
    --void-black: #050303;
    --coagulated-blood: #170000;
    --dried-blood: #3a0000;
    --fresh-blood: #8a0000;
    --pulsing-red: #c70000;
    --arterial-spray: #ff0505;
    
    /* Text Colors - High Contrast for Readability */
    --flesh-pale: #e8d0d0;
    --bone-white: #ffffff;
    --muted-bone: #b8a5a5;
    
    /* Typography */
    --font-title: 'Nosifer', display;
    --font-head: 'Teko', sans-serif;
    --font-body: 'Crimson Pro', serif;
    /* Fallback for --font-ui if missing */
    --font-ui: 'Courier New', Courier, monospace;

    /* Premium Easing & UI Base */
    --smooth-curve: cubic-bezier(0.25, 1, 0.3, 1);
    --panel-bg: rgba(10, 2, 2, 0.85);
}

/* ==========================================================================
   GLOBAL RESET & THE VOID
   ========================================================================== */
* { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    cursor: crosshair; 
}

::selection {
    background: var(--arterial-spray);
    color: var(--pitch-black);
    text-shadow: none;
}

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--pitch-black); }
::-webkit-scrollbar-thumb { background: var(--dried-blood); border-radius: 3px; transition: background 0.3s ease; }
::-webkit-scrollbar-thumb:hover { background: var(--pulsing-red); }

body, html {
    width: 100%;
    height: 100vh; /* Lock to exactly one frame */
    overflow: hidden; /* Prevent full-page scroll */
    background-color: transparent;
    color: var(--bone-white);
    font-family: var(--font-body);
}

body {
    display: flex;
    flex-direction: column;
    padding-top: 70px; /* Make room for the flush navbar */
}

/* Background Animation */
.bg-gif {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: -3; /* Keep it all the way in the back */
    pointer-events: none;
}

/* Ambient Deep Breathing Vignette */
body::before {
    content: "";
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 150vw;
    height: 150vh;
    background: radial-gradient(ellipse at center, transparent 15%, var(--void-black) 60%, var(--pitch-black) 100%);
    pointer-events: none;
    z-index: -1;
    box-shadow: inset 0 0 150px rgba(138, 0, 0, 0.15);
    animation: ambientVignettePulse 8s infinite ease-in-out;
}

/* Premium Asylum Wall Texture */
body::after {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background-image: repeating-linear-gradient(45deg, rgba(58, 0, 0, 0.03) 0px, transparent 1px, transparent 4px);
    opacity: 0.6;
    pointer-events: none;
    z-index: -2;
}

/* ==========================================================================
   NAVIGATION – MEATHOOKS, ALWAYS FIXED ON TOP (FLUSH)
   ========================================================================== */
.navbar {
    width: 100%;
    height: 70px; /* Medium size */
    position: fixed;
    top: 0; /* Flush to the top edge */
    left: 0;
    background: linear-gradient(
        to bottom, 
        rgba(0, 0, 0, 0.98) 0%, 
        rgba(30, 5, 5, 0.92) 100%
    );
    border-bottom: 2px solid var(--dried-blood);
    z-index: 1000;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    animation: organicHeartbeatBorderBottom 4s infinite var(--smooth-curve);
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}

.nav-links {
    display: flex;
    gap: 40px; /* Slightly tighter gap to fit medium size */
    list-style: none;
    align-items: center;
    justify-content: center;
}

.navbar li a {
    font-family: var(--font-ui);
    font-size: 1.5rem; /* Medium font */
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--muted-bone);
    text-decoration: none;
    text-transform: uppercase;
    position: relative;
    padding: 5px 15px;
    transition: all 0.3s var(--smooth-curve);
}

/* Elegant Blood Slash on Hover */
.navbar li a::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 2px;
    background: var(--arterial-spray);
    transform: translate(-50%, -50%) rotate(-3deg);
    transition: width 0.4s var(--smooth-curve);
    box-shadow: 0 0 10px var(--arterial-spray);
    z-index: 2;
    opacity: 0;
}

.navbar li a:hover {
    color: var(--bone-white);
    text-shadow: 0 0 15px rgba(255, 5, 5, 0.7);
}

.navbar li a:hover::before {
    width: 100%;
    opacity: 1;
}

/* ==========================================================================
   MAIN LAYOUT & CONTROLS (FIT TO FRAME)
   ========================================================================== */
.app-container {
    display: flex;
    flex-direction: column;
    flex: 1; /* Takes up remaining height after navbar */
    height: calc(100vh - 70px);
    padding: 1.5rem 2rem; /* Medium padding */
    gap: 1.5rem;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    overflow: hidden; /* Crucial for one-frame layout */
    box-sizing: border-box;
}

.controls-header {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    background: var(--panel-bg);
    padding: 1rem 1.5rem;
    border-radius: 4px;
    border: 1px solid var(--dried-blood);
    backdrop-filter: blur(10px);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
    animation: organicHeartbeatBorderFull 4s infinite var(--smooth-curve);
    flex-shrink: 0; /* Prevents this section from squishing */
}

.controls-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1.5rem;
}

/* Faction Toggles */
.faction-toggle {
    display: flex;
    background: rgba(0,0,0,0.8);
    border-radius: 2px;
    overflow: hidden;
    border: 1px solid var(--dried-blood);
}

.faction-btn {
    background: transparent;
    color: var(--muted-bone);
    border: none;
    padding: 0.6rem 1.5rem;
    font-family: var(--font-head);
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 2px;
    transition: all 0.3s;
    text-transform: uppercase;
}

.faction-btn.active {
    background: linear-gradient(to bottom, var(--fresh-blood), var(--dried-blood));
    color: var(--bone-white);
    text-shadow: 0 2px 4px var(--pitch-black);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
}

/* Search Engine */
.search-container { flex-grow: 1; }

.search-bar {
    width: 100%;
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--dried-blood);
    color: var(--bone-white);
    padding: 0.6rem 1.2rem;
    font-family: var(--font-body);
    font-size: 1.1rem;
    border-radius: 2px;
    outline: none;
    transition: all 0.3s var(--smooth-curve);
}

.search-bar:focus { 
    border-color: var(--arterial-spray);
    box-shadow: 0 0 15px rgba(200, 0, 0, 0.3), inset 0 0 10px rgba(200, 0, 0, 0.1); 
}
.search-bar::placeholder { color: var(--muted-bone); opacity: 0.5; font-style: italic; }

/* Sort Dropdown */
.sort-dropdown {
    background: rgba(0,0,0,0.7);
    color: var(--bone-white);
    border: 1px solid var(--dried-blood);
    padding: 0.6rem 1.2rem;
    font-family: var(--font-head);
    font-size: 1.1rem;
    letter-spacing: 1px;
    border-radius: 2px;
    outline: none;
}
.sort-dropdown option { background: var(--pitch-black); color: var(--bone-white); }

/* Category Tabs (Centered) */
.category-tabs {
    display: flex;
    justify-content: center;
    gap: 1rem;
    padding-bottom: 0.2rem;
}

.cat-tab {
    background: transparent;
    border: 1px solid var(--dried-blood);
    color: var(--muted-bone);
    padding: 0.3rem 1.2rem;
    border-radius: 20px;
    font-family: var(--font-head);
    font-size: 0.9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.3s;
}

.cat-tab:hover, .cat-tab.active {
    border-color: var(--arterial-spray);
    color: var(--bone-white);
    background: rgba(138, 0, 0, 0.15);
    box-shadow: 0 0 10px rgba(255, 5, 5, 0.2);
}

/* ==========================================================================
   CONTENT AREA - SPLIT VIEW SYMMETRY (AUTO-SCROLLING PANELS)
   ========================================================================== */
.content-area {
    display: flex;
    gap: 1.5rem;
    flex: 1; /* Takes the rest of the available app-container height */
    min-height: 0; /* Important for preventing flexbox from overflowing */
    overflow: hidden;
}

/* Left: Archive List */
.perk-list-container {
    width: 35%;
    height: 100%;
    background: var(--panel-bg);
    border: 1px solid var(--dried-blood);
    border-radius: 4px;
    overflow-y: auto; /* Scrolls only internally */
    backdrop-filter: blur(10px);
    animation: organicHeartbeatBorderFull 4s infinite var(--smooth-curve);
    animation-delay: 0.5s;
}

.perk-card {
    display: flex;
    align-items: center;
    gap: 1.2rem;
    padding: 1rem;
    border-bottom: 1px solid rgba(58, 0, 0, 0.4);
    transition: all 0.2s var(--smooth-curve);
    position: relative;
}

.perk-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0; width: 0px;
    background: var(--arterial-spray);
    transition: width 0.3s var(--smooth-curve);
}

.perk-card:hover, .perk-card.active { 
    background: linear-gradient(90deg, rgba(58, 0, 0, 0.3) 0%, transparent 100%); 
}
.perk-card.active::before, .perk-card:hover::before { 
    width: 4px; 
    box-shadow: 0 0 15px var(--arterial-spray); 
}

.perk-card-icon {
    width: 50px; height: 50px;
    object-fit: contain;
    filter: grayscale(100%) brightness(0.5);
    transition: all 0.4s;
}

.perk-card.active .perk-card-icon, .perk-card:hover .perk-card-icon {
    filter: drop-shadow(0 0 8px rgba(255,5,5,0.6)) grayscale(0%) brightness(1);
}

.perk-card-info h3 { 
    font-family: var(--font-head); 
    font-size: 1.3rem; 
    letter-spacing: 1px; 
    color: var(--bone-white); 
}
.perk-card-info span { 
    font-size: 0.9rem; 
    color: var(--pulsing-red); 
    font-style: italic; 
}

/* Right: Display Panel */
.perk-display-container {
    width: 65%;
    height: 100%;
    background: var(--panel-bg);
    border: 1px solid var(--dried-blood);
    border-radius: 4px;
    padding: 2rem; /* Medium padding */
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    backdrop-filter: blur(10px);
    overflow-y: auto; /* Scrolls only internally */
    animation: organicHeartbeatBorderFull 4s infinite var(--smooth-curve);
}

.display-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
    border-bottom: 1px dashed var(--dried-blood);
    padding-bottom: 1.5rem;
    width: 100%;
}

.display-icon-wrapper {
    position: relative;
    width: 140px; height: 140px; /* Medium size */
    display: flex; justify-content: center; align-items: center;
}

/* Visceral Rotating Blood Ring */
.display-icon-wrapper::after {
    content: '';
    position: absolute;
    width: 100%; height: 100%;
    border: 2px dashed var(--dried-blood);
    border-top-color: var(--arterial-spray);
    border-bottom-color: var(--pulsing-red);
    border-radius: 50%;
    animation: rotateDash 8s linear infinite;
    box-shadow: inset 0 0 20px rgba(138,0,0,0.2), 0 0 20px rgba(138,0,0,0.2);
}

@keyframes rotateDash { 100% { transform: rotate(360deg); } }

#display-icon {
    width: 100px; height: 100px;
    object-fit: contain;
    filter: drop-shadow(0 10px 25px rgba(255, 5, 5, 0.4));
}

.display-title-group {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.display-title-group h1 {
    font-family: var(--font-head);
    font-size: 3rem; /* Medium-large to fit frame */
    text-transform: uppercase;
    color: var(--arterial-spray);
    letter-spacing: 3px;
    text-shadow: 0 5px 15px rgba(138, 0, 0, 0.6);
    margin-bottom: 0.5rem;
    line-height: 1;
}

.meta-tags { display: flex; justify-content: center; gap: 0.8rem; }

.meta-tag {
    background: rgba(23, 0, 0, 0.6);
    border: 1px solid var(--dried-blood);
    padding: 0.3rem 1rem;
    border-radius: 2px;
    font-family: var(--font-head);
    font-size: 1rem;
    letter-spacing: 2px;
    color: var(--flesh-pale);
    text-transform: uppercase;
}

.display-desc {
    font-size: 1.1rem; /* Better scale for frame fitting */
    line-height: 1.6;
    color: var(--bone-white);
    max-width: 800px;
    margin-bottom: 2rem;
}

/* Automated Scenario Module - Horror Version */
.scenario-box {
    background: linear-gradient(135deg, rgba(15,0,0,0.9), rgba(5,0,0,0.95));
    border: 1px solid var(--dried-blood);
    border-left: 4px solid var(--fresh-blood);
    padding: 1.5rem 2rem; /* Scaled down for medium size */
    width: 100%;
    max-width: 800px;
    position: relative;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 10px 20px rgba(0,0,0,0.5);
}

.scenario-box::before {
    content: '>> ENTITY SIMULATION';
    display: block;
    font-family: var(--font-head);
    color: var(--pulsing-red);
    font-size: 1.1rem;
    margin-bottom: 0.8rem;
    letter-spacing: 3px;
    text-shadow: 0 0 8px rgba(200, 0, 0, 0.4);
}

#display-scenario {
    font-size: 1.1rem;
    color: var(--muted-bone);
    font-style: italic;
    line-height: 1.5;
}

/* ==========================================================================
   VISCERAL ANIMATIONS & HEARTBEATS
   ========================================================================== */

@keyframes organicHeartbeatBorderFull {
    0%, 100% { border-color: var(--dried-blood); box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
    10% { border-color: var(--arterial-spray); box-shadow: 0 15px 40px rgba(200, 0, 0, 0.25), inset 0 0 10px rgba(200, 0, 0, 0.05); }
    20% { border-color: var(--dried-blood); box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
    30% { border-color: var(--pulsing-red); box-shadow: 0 15px 38px rgba(150, 0, 0, 0.15); }
    40%, 95% { border-color: var(--dried-blood); box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
}

@keyframes organicHeartbeatBorderBottom {
    0%, 100% { border-bottom-color: var(--dried-blood); box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
    10% { border-bottom-color: var(--arterial-spray); box-shadow: 0 8px 30px rgba(255, 5, 5, 0.3); }
    20% { border-bottom-color: var(--dried-blood); box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
    30% { border-bottom-color: var(--pulsing-red); box-shadow: 0 8px 28px rgba(200, 0, 0, 0.2); }
    40%, 95% { border-bottom-color: var(--dried-blood); box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
}

@keyframes ambientVignettePulse {
    0%, 100% { box-shadow: inset 0 0 100px rgba(30, 0, 0, 0.8); }
    50% { box-shadow: inset 0 0 180px rgba(100, 0, 0, 0.3); }
}

.glitch-text { animation: bloodGlitch 0.4s cubic-bezier(0.25, 1, 0.3, 1) both; color: var(--arterial-spray); }
@keyframes bloodGlitch {
    0% { transform: translate(0) }
    20% { transform: translate(-3px, 2px); text-shadow: -2px 0 red, 2px 0 black; }
    40% { transform: translate(-1px, -3px) }
    60% { transform: translate(3px, 1px); text-shadow: 2px 0 red, -2px 0 black; }
    80% { transform: translate(1px, -2px) }
    100% { transform: translate(0) }
}
    </style>
</head>

function normalizeString(str) {
    return str.toLowerCase()
        .replace(/[éèêë]/g, 'e')
        .replace(/[üùû]/g, 'u')
        .replace(/[àâä]/g, 'a')
        .replace(/[ôö]/g, 'o')
        .replace(/[^a-z0-9]/g, '');
}

function fuzzyMatchFilename(perkName) {
    let normalized = normalizeString(perkName);
    
    // Special case mappings for known problematic names (check FIRST)
    const specialCases = {
        'dejavu': 'IconPerks_dejaVu.webp',
        'coupdegrace': 'IconPerks_coupDeGrace.webp',
        'hexovertureofdoom': 'IconPerks_hexOvertureOfDoom.webp',
        'ravenous': 'IconPerks_ravenous.webp',
        'wanderingeye': 'IconPerks_wanderingEye.webp',
        'barbecuechilli': 'IconPerks_barbecueAndChilli.webp',
        'monitorabuse': 'IconPerks_monitorAndAbuse.webp',
        'quickquiet': 'IconPerks_quick&Quiet.webp'  // Add this line
    };
    
    // Check special cases first
    if (specialCases[normalized]) {
        return specialCases[normalized];
    }
    
    // Direct match using normalized comparison
    let match = fileArray.find(f => {
        let fNorm = f.replace('IconPerks_', '').replace('.webp', '').toLowerCase();
        return normalizeString(fNorm) === normalized;
    });
    
    // If no direct match, try partial match
    if (!match) {
        match = fileArray.find(f => {
            let fNorm = normalizeString(f.replace('IconPerks_', '').replace('.webp', ''));
            return fNorm.includes(normalized) || normalized.includes(fNorm);
        });
    }
    
    return match ? match : `IconPerks_default.webp`;
}

        function applyFilters() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const sortVal = document.getElementById('sort-select').value;
            
            let filtered = currentDataset.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query);
                const matchCat = activeCategory === 'ALL' || p.category === activeCategory;
                return matchSearch && matchCat;
            });

            if (sortVal === 'A-Z') {
                filtered.sort((a,b) => a.name.localeCompare(b.name));
            } else if (sortVal === 'Z-A') {
                filtered.sort((a,b) => b.name.localeCompare(a.name));
            } else if (sortVal === 'CATEGORY') {
                filtered.sort((a,b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
            }

            renderList(filtered);

            document.getElementById('display-desc').innerText = perk.desc;
            
            // Generate Scenario
            document.getElementById('display-scenario').innerText = generateScenario(perk, currentMode);
        }

        // --- Event Handlers ---
        
        function setFaction(mode) {
            currentMode = mode;
            currentDataset = mode === 'survivor' ? survivorPerks : killerPerks;
            activeCategory = 'ALL';
            
            // Toggle Body Class for CSS Theme change
            if(mode === 'killer') document.body.classList.add('killer-mode');
            else document.body.classList.remove('killer-mode');

            // Toggle Buttons
            document.getElementById('btn-survivor').classList.toggle('active', mode === 'survivor');
            document.getElementById('btn-killer').classList.toggle('active', mode === 'killer');

            // Reset Inputs
            document.getElementById('search-input').value = '';
            document.getElementById('sort-select').value = 'A-Z';

            renderTabs();
            applyFilters();
        }

        function handleSearch() { applyFilters(); }
        function handleSort() { applyFilters(); }

        // --- Initialization ---
        setFaction('survivor');
</script>
</body>
</html>
